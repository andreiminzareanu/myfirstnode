name: Node.js CI/CD

on:
  push:
    branches:
      - main  # sau branch-ul tău

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'  # versiunea Node.js folosită în proiect

    - name: Install dependencies
      run: npm install

    - name: Run build (optional)
      run: npm run build

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: "mywebapp111"
        package: .
